 apiVersion: kustomize.config.k8s.io/v1beta1
 kind: Kustomization
 namespace: monitoring
 configMapGenerator:
   - name: sre-dashboards
     files:
       - executive-sre.json
       - chaos-incident.json
       - infra-k8s-health.json
       - logs-traces.json
       - service-mesh-traffic.json
       - incident-management.json
     options:
       disableNameSuffixHash: true
       labels:
         grafana_dashboard: "1"
 generatorOptions:
   disableNameSuffixHash: true
