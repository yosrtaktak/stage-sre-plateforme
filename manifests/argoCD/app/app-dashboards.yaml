 apiVersion: argoproj.io/v1alpha1
 kind: Application
 metadata:
   name: dashboards
   namespace: argocd
 spec:
   project: default
   source:
     repoURL: https://github.com/yosrtaktak/stage-sre-plateforme
     targetRevision: stage-yosr
     path: manifests/dashboards
   destination:
     server: https://kubernetes.default.svc
     namespace: monitoring
   syncPolicy:
     syncOptions:
       - ServerSideApply=true
