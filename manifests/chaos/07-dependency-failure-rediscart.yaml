# =============================================================================
#  EXP 7 — Dependency Failure : redis-cart (network-loss 100 %, replicas=1)
#  Alertes attendues : CartDegraded (warning, ~6 min) — il n'existe AUCUN SLI
#  Redis : la panne est detectee INDIRECTEMENT via le SLI cartservice
#  (sli:cart_availability), car cartservice echoue des que sa dependance
#  redis-cart est injoignable (gRPC 13/14 -> comptés en erreur depuis le fix
#  gRPC des recording rules).
#  Demo cle : panne d'une DEPENDANCE (pod redis Ready, reseau coupe) — ni
#  Kubernetes ni un SLI dedie ne la voient ; c'est le SLI du CONSOMMATEUR
#  (cart) qui revele le probleme. Complement de l'EXP 3 (payment/checkout).
#  Redis est TCP pur (pas de metrique istio_requests_total L7 sur redis-cart) :
#  inutile d'esperer un SLI redis — argument a presenter.
#
#  ⚠️ K3s : SOCKET_PATH containerd specifique K3s obligatoire.
#  ⚠️ TARGET_CONTAINER = "redis" (nom du conteneur dans le deployment).
# =============================================================================
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: rediscart-network-loss
  namespace: online-boutique
spec:
  engineState: active
  annotationCheck: "false"
  chaosServiceAccount: chaos-sa
  appinfo:
    appns: online-boutique
    applabel: app=redis-cart
    appkind: deployment
  experiments:
    - name: pod-network-loss
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "420"          # 7 min : CartDegraded exige ratio5m < 0.99 pendant for: 5m
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: "100"
            - name: TARGET_CONTAINER
              value: "redis"        # nom du conteneur dans redis-cart (≠ "server")
            - name: PODS_AFFECTED_PERC
              value: "100"
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/k3s/containerd/containerd.sock"   # chemin K3s

