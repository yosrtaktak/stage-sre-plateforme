apiVersion: v1
data:
  deploy-annotator.py: "#!/usr/bin/env python3\n\"\"\"\ndeploy-annotator.py — B0 :
    traçabilité incident → commit\nPour chaque Application Argo CD :\n  1. Lit operationState.syncResult.revision\n
    \ 2. Compare au dernier hash connu (état persistant)\n  3. Si nouveau sync : annotation
    Grafana + écriture du contexte pour le bridge\nAucun droit d'écriture sur le cluster
    — lecture seule (kubectl get uniquement).\n\"\"\"\nimport json\nimport subprocess\nimport
    urllib.request\nimport urllib.error\nimport os\nimport sys\n\nAPPS = [\"dashboards\",
    \"online-boutique\", \"monitoring\"]\nSTATE_FILE = \"/state/deploy-tracking.json\"\nCONTEXT_FILE
    = \"/state/last-deploys.json\"  # lu par le bridge\nGRAFANA_URL = os.environ.get(\"GRAFANA_URL\",
    \"\").rstrip(\"/\")\nGRAFANA_TOKEN = os.environ.get(\"GRAFANA_TOKEN\", \"\")\nREPO_DIR
    = os.environ.get(\"REPO_DIR\", \"/repo\")  # clone local en lecture seule\n\n\ndef
    log(msg):\n    print(f\"[deploy-annotator] {msg}\", file=sys.stderr)\n\n\ndef
    get_app_sync_state(app):\n    try:\n        out = subprocess.run(\n            [\"kubectl\",
    \"get\", \"application\", app, \"-n\", \"argocd\", \"-o\", \"json\"],\n            capture_output=True,
    text=True, check=True, timeout=10\n        )\n    except subprocess.CalledProcessError
    as e:\n        log(f\"kubectl error for {app}: {e.stderr}\")\n        return None\n
    \   d = json.loads(out.stdout)\n    op = d.get(\"status\", {}).get(\"operationState\",
    {}) or {}\n    sync_result = op.get(\"syncResult\", {}) or {}\n    return {\n
    \       \"revision\": sync_result.get(\"revision\"),\n        \"finishedAt\":
    op.get(\"finishedAt\"),\n        \"phase\": op.get(\"phase\"),\n    }\n\n\ndef
    load_json(path, default):\n    if os.path.exists(path):\n        try:\n            with
    open(path) as f:\n                return json.load(f)\n        except (json.JSONDecodeError,
    OSError):\n            return default\n    return default\n\n\ndef save_json_atomic(path,
    data):\n    tmp = path + \".tmp\"\n    with open(tmp, \"w\") as f:\n        json.dump(data,
    f, indent=2)\n    os.replace(tmp, path)  # écriture atomique\n\n\ndef get_changed_files(old_rev,
    new_rev):\n    if not old_rev or old_rev == new_rev:\n        return []\n    try:\n
    \       out = subprocess.run(\n            [\"git\", \"-C\", REPO_DIR, \"diff\",
    \"--name-only\", old_rev, new_rev],\n            capture_output=True, text=True,
    check=True, timeout=10\n        )\n        return [line for line in out.stdout.splitlines()
    if line.strip()]\n    except subprocess.CalledProcessError as e:\n        log(f\"git
    diff error: {e.stderr}\")\n        return []\n\n\ndef get_commit_message(rev):\n
    \   try:\n        out = subprocess.run(\n            [\"git\", \"-C\", REPO_DIR,
    \"log\", \"-1\", \"--pretty=%s\", rev],\n            capture_output=True, text=True,
    check=True, timeout=10\n        )\n        return out.stdout.strip()\n    except
    subprocess.CalledProcessError:\n        return \"\"\n\n\ndef post_grafana_annotation(app,
    revision, files, message):\n    if not GRAFANA_URL or not GRAFANA_TOKEN:\n        log(\"Grafana
    non configuré (GRAFANA_URL/GRAFANA_TOKEN absents) — skip annotation\")\n        return\n
    \   text = f\"\U0001F680 Sync {app} → {revision[:8]} — {message}\"\n    if files:\n
    \       text += f\" ({len(files)} fichier(s): {', '.join(files[:5])}{'...' if
    len(files) > 5 else ''})\"\n    payload = json.dumps({\n        \"text\": text,\n
    \       \"tags\": [\"deploy\", app],\n    }).encode()\n    req = urllib.request.Request(\n
    \       f\"{GRAFANA_URL}/api/annotations\",\n        data=payload,\n        headers={\n
    \           \"Content-Type\": \"application/json\",\n            \"Authorization\":
    f\"Bearer {GRAFANA_TOKEN}\",\n        },\n        method=\"POST\",\n    )\n    try:\n
    \       urllib.request.urlopen(req, timeout=10)\n        log(f\"Annotation Grafana
    postée pour {app} ({revision[:8]})\")\n    except urllib.error.URLError as e:\n
    \       log(f\"Erreur annotation Grafana pour {app}: {e}\")\n\n\ndef main():\n
    \   state = load_json(STATE_FILE, {})\n    context = load_json(CONTEXT_FILE, {})\n\n
    \   for app in APPS:\n        sync_state = get_app_sync_state(app)\n        if
    not sync_state or sync_state[\"phase\"] != \"Succeeded\":\n            continue\n\n
    \       new_rev = sync_state[\"revision\"]\n        old_rev = state.get(app, {}).get(\"revision\")\n\n
    \       if new_rev and new_rev != old_rev:\n            log(f\"{app}: nouveau
    sync détecté {old_rev} → {new_rev}\")\n            files = get_changed_files(old_rev,
    new_rev)\n            message = get_commit_message(new_rev)\n\n            post_grafana_annotation(app,
    new_rev, files, message)\n\n            # Contexte pour le bridge — jamais l'auteur,
    uniquement le commit (no-blame)\n            context[app] = {\n                \"git_commit\":
    new_rev,\n                \"git_repo_paths\": files,\n                \"synced_at\":
    sync_state[\"finishedAt\"],\n                \"commit_message\": message,\n            }\n
    \           save_json_atomic(CONTEXT_FILE, context)\n\n        state[app] = sync_state\n
    \       save_json_atomic(STATE_FILE, state)\n\n    log(\"Cycle terminé\")\n\n\nif
    __name__ == \"__main__\":\n    main()\n"
kind: ConfigMap
metadata:
  name: deploy-annotator-script
  namespace: monitoring
