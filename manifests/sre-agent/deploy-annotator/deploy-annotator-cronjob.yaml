apiVersion: batch/v1
kind: CronJob
metadata:
  name: deploy-annotator
  namespace: monitoring
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      template:
        spec:
          serviceAccountName: deploy-annotator
          restartPolicy: OnFailure
          initContainers:
            - name: git-clone
              image: alpine/git:latest
              command:
                - sh
                - -c
                - |
                  apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
                  python3 /scripts/deploy-annotator.py
                  URL="https://${GIT_USER}:${GIT_TOKEN}@github.com/yosrtaktak/stage-sre-plateforme"
                  if [ -d /repo/.git ]; then
                    git -C /repo fetch --depth=50 "$URL" stage-yosr
                    git -C /repo reset --hard FETCH_HEAD
                  else
                    git clone --depth=50 --branch stage-yosr "$URL" /repo
                  fi
              env:
                - name: GITHUB_REPO
                  value: "yosrtaktak/stage-sre-plateforme" 
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: repo-stage-sre
                      key: password
                - name: GIT_USER
                  valueFrom:
                    secretKeyRef:
                      name: deploy-annotator-git
                      key: username
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: deploy-annotator-git
                      key: token
              volumeMounts:
                - name: repo
                  mountPath: /repo
          containers:
            - name: deploy-annotator
              image: python:3.11-slim
              command: ["python3", "/scripts/deploy-annotator.py"]
              env:
                - name: GRAFANA_URL
                  value: "http://grafana.monitoring.svc.cluster.local:80"
                - name: GRAFANA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grafana-agent-token
                      key: token
                      optional: true
                - name: REPO_DIR
                  value: "/repo"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: state
                  mountPath: /state
                - name: repo
                  mountPath: /repo
          volumes:
            - name: script
              configMap:
                name: deploy-annotator-script
            - name: state
              persistentVolumeClaim:
                claimName: holmes-bridge-state
            - name: repo
              emptyDir: {}
