# =============================================================================
#  holmes-bridge : Alertmanager -> HolmesGPT -> Slack
# -----------------------------------------------------------------------------
#  Le script est monté depuis un ConfigMap (à créer depuis le repo) :
#    kubectl -n monitoring create configmap holmes-bridge-script \
#      --from-file=ai-agent/bridge/holmes-bridge.py \
#      --dry-run=client -o yaml | kubectl apply -f -
#  Les diagnostics partent sur un canal Slack DÉDIÉ à l'agent (ex. #sre-agent),
#  séparé des 2 canaux d'alerte existants. Créer d'abord le webhook entrant
#  (api.slack.com/apps -> votre app -> Incoming Webhooks -> Add New Webhook,
#  choisir le nouveau canal), puis le Secret :
#    kubectl -n monitoring create secret generic holmes-slack-webhook \
#      --from-literal=slack-url-agent='https://hooks.slack.com/services/T…/B…/…'
#  Déploiement : kubectl apply -f ai-agent/bridge/bridge-deployment.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-bridge
  namespace: monitoring
  labels:
    app: holmes-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-bridge
  template:
    metadata:
      labels:
        app: holmes-bridge
      # Méta-observabilité : Prometheus scrappe GET /metrics du bridge
      # (compteurs d'enquêtes, skips, 429, fallbacks, durées).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: bridge
          image: python:3.11-slim
          command: ["python", "/app/holmes-bridge.py"]
          env:
            - name: HOLMES_URL
              value: "http://holmesgpt-holmes.monitoring.svc.cluster.local:80"
            - name: HOLMES_MODEL
              value: "gemini-flash"
            - name: SLACK_WEBHOOK_FILE          # canal dédié agent (#sre-agent)
              value: "/etc/slack/slack-url-agent"
            - name: DEDUP_TTL_S          # 1 investigation max par alerte / heure
              value: "3600"
            - name: MAX_PER_HOUR         # plafond global : protège le free tier
              value: "10"
            - name: POSTMORTEM_ENABLED   # rapport post-incident sur resolved
              value: "true"              # exige aussi send_resolved: true
                                         # dans le receiver Alertmanager
            # Politique post-mortem : "critical,warning" + 60 s = un 📋 après
            # CHAQUE incident réel (seuls les flaps < 1 min sont ignorés).
            # Si le canal redevient bruyant, resserrer à "critical" / "300".
            - name: POSTMORTEM_SEVERITIES   # CSV des sévérités éligibles
              value: "critical,warning"
            - name: POSTMORTEM_MIN_S        # durée minimale de l'incident
              value: "60"
            # Retry quand le free tier Gemini répond 429 (quota/minute).
            - name: RETRY_MAX
              value: "3"
            - name: RETRY_WAIT_S
              value: "75"
            - name: DEDUP_STATE_FILE     # persistance de la dédup (emptyDir)
              value: "/state/seen.json"
            # Amélioration D : annotations Grafana à chaque verdict. Token
            # partagé avec les toolsets Loki/Tempo de Holmes — Secret
            # grafana-agent-token (optionnel : sans lui, la feature se
            # désactive toute seule, le bridge démarre quand même) :
            #   kubectl -n monitoring create secret generic grafana-agent-token \
            #     --from-literal=token='glsa_...'
            - name: GRAFANA_URL
              value: "http://grafana.monitoring.svc.cluster.local:80"
            - name: GRAFANA_TOKEN_FILE
              value: "/etc/grafana/token"
            # Amélioration E : modèles de secours (CSV, essayés dans l'ordre)
            # quand le quota est épuisé après les retries. Les quotas Gemini
            # free tier sont PAR MODÈLE : gemini-flash-31 (3.1-flash-lite) a
            # son propre compteur 250k tokens/min — Groq reste le dernier
            # recours (100k tokens/jour). Laisser vide pour désactiver.
            - name: FALLBACK_MODEL
              value: "gemini-flash-31,groq-llama70b"
            # RAG : chaque diagnostic/post-mortem publié est indexé dans la
            # base vectorielle des incidents. Vide = désactivé.
            - name: RAG_URL
              value: "http://postmortem-rag.monitoring.svc.cluster.local:8100"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: slack
              mountPath: /etc/slack
              readOnly: true
            - name: state              # survit aux restarts du conteneur
              mountPath: /state
            - name: grafana            # token annotations (Secret optionnel)
              mountPath: /etc/grafana
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
      volumes:
        - name: script
          configMap:
            name: holmes-bridge-script
        - name: slack
          secret:
            secretName: holmes-slack-webhook
        - name: state
          emptyDir: {}   # dédup persistante : survit aux restarts du
                         # conteneur (pas à la suppression du pod — assumé)
        - name: grafana
          secret:
            secretName: grafana-agent-token
            optional: true   # sans le Secret, le montage est vide et la
                             # feature annotations reste simplement off
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-bridge
  namespace: monitoring
  labels:
    app: holmes-bridge
spec:
  selector:
    app: holmes-bridge
  ports:
    - port: 8000
      targetPort: 8000

