# =============================================================================
#  holmes-bridge : Alertmanager -> HolmesGPT -> Slack   —   VERSION GITOPS
# -----------------------------------------------------------------------------
#  Ce fichier vit dans manifests/ai-agent/ du repo et est déployé par
#  l'Application ArgoCD « ai-agent ». La ConfigMap holmes-bridge-script est
#  GÉNÉRÉE par kustomize (configMapGenerator, nom hashé) : ne plus la créer
#  à la main — kustomize réécrit la référence du volume ci-dessous vers le
#  nom hashé, et tout changement des .py déclenche un rollout automatique.
#  Les Secrets restent créés à la main (repo public, jamais dans Git) :
#    kubectl -n monitoring create secret generic holmes-slack-webhook \
#      --from-literal=slack-url-agent='https://hooks.slack.com/services/…'
#  (+ github-remediation et grafana-agent-token, cf. commentaires plus bas)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-bridge
  namespace: monitoring
  labels:
    app: holmes-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-bridge
  template:
    metadata:
      labels:
        app: holmes-bridge
      # Méta-observabilité : Prometheus scrappe GET /metrics du bridge
      # (compteurs d'enquêtes, skips, 429, fallbacks, durées).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Correctif N2 : l'agent partage le mono-node avec les workloads sous
      # chaos — cette priorité évite que bridge/RAG soient évincés les
      # premiers sous pression (vécu le 28/07 pendant le memory-hog).
      priorityClassName: sre-agent
      # B0 : SA avec lecture seule des Applications Argo CD (namespace
      # argocd) — cf. argocd-reader-rbac.yaml, à appliquer AVANT.
      serviceAccountName: holmes-bridge
      containers:
        - name: bridge
          image: ghcr.io/yosrtaktak/sre-bridge:sha-1af884e@sha256:53fe56f2518725b7ac73c2f5a942789df0152014fc0eabbb91914250b4c583ed
          env:
            - name: HOLMES_URL
              value: "http://holmesgpt-holmes.monitoring.svc.cluster.local:80"
            - name: HOLMES_MODEL
              value: "gemini-flash"
            - name: SLACK_WEBHOOK_FILE          # canal dédié agent (#sre-agent)
              value: "/etc/slack/slack-url-agent"
            - name: DEDUP_TTL_S          # 1 investigation max par alerte / heure
              value: "3600"
            - name: MAX_PER_HOUR         # plafond global : protège le free tier
              value: "10"
            - name: POSTMORTEM_ENABLED   # rapport post-incident sur resolved
              value: "true"              # exige aussi send_resolved: true
                                         # dans le receiver Alertmanager
            # Politique post-mortem : "critical,warning" + 60 s = un 📋 après
            # CHAQUE incident réel (seuls les flaps < 1 min sont ignorés).
            # Si le canal redevient bruyant, resserrer à "critical" / "300".
            - name: POSTMORTEM_SEVERITIES   # CSV des sévérités éligibles
              value: "critical,warning"
            - name: POSTMORTEM_MIN_S        # durée minimale de l'incident
              value: "60"
            # Retry quand le free tier Gemini répond 429 (quota/minute).
            - name: RETRY_MAX
              value: "3"
            - name: RETRY_WAIT_S
              value: "75"
            - name: DEDUP_STATE_FILE     # persistance de la dédup (emptyDir)
              value: "/state/seen.json"
            # Amélioration D : annotations Grafana à chaque verdict. Token
            # partagé avec les toolsets Loki/Tempo de Holmes — Secret
            # grafana-agent-token (optionnel : sans lui, la feature se
            # désactive toute seule, le bridge démarre quand même) :
            #   kubectl -n monitoring create secret generic grafana-agent-token \
            #     --from-literal=token='glsa_...'
            - name: GRAFANA_URL
              value: "http://grafana.monitoring.svc.cluster.local:80"
            - name: GRAFANA_TOKEN_FILE
              value: "/etc/grafana/token"
            # Amélioration E : modèles de secours (CSV, essayés dans l'ordre)
            # quand le quota est épuisé après les retries. Les quotas Gemini
            # free tier sont PAR MODÈLE : gemini-flash-31 (3.1-flash-lite) a
            # son propre compteur 250k tokens/min — Groq reste le dernier
            # recours (100k tokens/jour). Laisser vide pour désactiver.
            - name: FALLBACK_MODEL
              value: "gemini-flash-31,groq-llama70b"
            # RAG : chaque diagnostic/post-mortem publié est indexé dans la
            # base vectorielle des incidents. Vide = désactivé.
            - name: RAG_URL
              value: "http://postmortem-rag.monitoring.svc.cluster.local:8100"
            # B0 : corrélation incident <-> déploiement GitOps (lecture des
            # Applications Argo CD). Se dégrade tout seul si Argo CD ou le
            # RBAC manquent — l'enquête continue sans contexte GitOps.
            - name: ARGOCD_ENABLED
              value: "true"
            - name: DEPLOY_WINDOW_S    # fenêtre « déploiement récent » (2 h)
              value: "7200"
            - name: ARGOCD_POLL_S      # période de l'annotateur de syncs
              value: "60"
            # B1 : Remediation-as-PR. Requiert le Secret github-remediation
            # (clés token/repo/base, PAT fine-grained Contents RW + Pull
            # requests RW sur le seul repo) monté sur /etc/github :
            #   kubectl -n monitoring create secret generic github-remediation \
            #     --from-literal=token='github_pat_…' \
            #     --from-literal=repo='yosrtaktak/stage-sre-plateforme' \
            #     --from-literal=base='stage-yosr'
            # Sans le Secret, la feature se désactive toute seule.
            - name: REMEDIATION_ENABLED
              value: "true"
            # B4 : vérification post-sync. À l'issue de la fenêtre, les burn
            # rates (slo:*:burnrate5m) sont comparés avant/après le sync :
            # stables -> ✅ Slack + syncs_verified_total ; dégradés ->
            # enquête fingerprint sync-<sha> (peut proposer le rollback B1)
            # + syncs_degraded_total. CFR DORA = degraded/(verified+degraded).
            - name: VERIFY_SYNC_ENABLED
              value: "true"
            - name: VERIFY_AFTER_S     # fenêtre d'observation post-sync
              value: "1800"            # 30 min (mettre 300 pour une démo)
            - name: PROM_URL
              value: "http://obs-prometheus-server.monitoring.svc.cluster.local:80"
            # Incident Adapter (checklist anti lock-in) : cycle de vie des
            # incidents (open/ack/close + timeline agent) écrit dans NOTRE
            # base neutre via incident-db-api (PostgREST). L'URL pointe vers
            # l'API de la base, JAMAIS vers l'outil d'astreinte — GoAlert
            # est remplaçable sans toucher au bridge. Vide = feature off.
            - name: INCIDENT_API_URL
              value: "http://incident-db-api.monitoring.svc.cluster.local:3000"
            # War room (idée n°6) : chaque événement de timeline est reflété
            # dans le canal #sre-war-room. Clé OPTIONNELLE du Secret
            # holmes-slack-webhook (fichier absent = feature off) :
            #   kubectl -n monitoring patch secret holmes-slack-webhook -p \
            #     "{\"stringData\":{\"slack-url-warroom\":\"https://hooks.slack.com/services/...\"}}"
            - name: WAR_ROOM_WEBHOOK_FILE
              value: "/etc/slack/slack-url-warroom"
            # Garde-fou resolve : avant une clôture humaine (clic [Resolve]),
            # l'adapter demande à Alertmanager si l'alerte crie encore.
            # Active -> refus tracé ; injoignable -> laissez-passer ; vide =
            # garde-fou désactivé.
            - name: ALERTMANAGER_URL
              value: "http://obs-alertmanager.monitoring.svc.cluster.local:9093"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: slack
              mountPath: /etc/slack
              readOnly: true
            - name: state              # survit aux restarts du conteneur
              mountPath: /state
            - name: grafana            # token annotations (Secret optionnel)
              mountPath: /etc/grafana
              readOnly: true
            - name: github             # B1 : PAT remédiation (optionnel)
              mountPath: /etc/github
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: slack
          secret:
            secretName: holmes-slack-webhook
        - name: state
          # Correctif F1 : PVC (local-path, provisioner par défaut de K3s)
          # au lieu d'emptyDir — la dédup et la mémoire 24 h survivent
          # désormais aux suppressions/recréations du pod (un restart
          # pendant un orage d'alertes ne redéclenche plus de rafale).
          persistentVolumeClaim:
            claimName: holmes-bridge-state
        - name: grafana
          secret:
            secretName: grafana-agent-token
            optional: true   # sans le Secret, le montage est vide et la
                             # feature annotations reste simplement off
        - name: github
          secret:
            secretName: github-remediation
            optional: true   # sans le Secret, remediation reste off
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-bridge
  namespace: monitoring
  labels:
    app: holmes-bridge
spec:
  selector:
    app: holmes-bridge
  ports:
    - port: 8000
      targetPort: 8000
---
# État persistant du bridge (dédup + mémoire des diagnostics 24 h).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holmes-bridge-state
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path     # provisioner par défaut de K3s
  resources:
    requests:
      storage: 100Mi
---
# Priorité d'ordonnancement des composants de l'agent : sous pression du
# nœud (chaos, tempête de redémarrage), ils sont évincés en DERNIER —
# l'enquêteur doit survivre à l'incident qu'il enquête.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: sre-agent
value: 100000
globalDefault: false
description: "Composants de l'agent SRE (bridge, RAG) — évincés en dernier"

