# =============================================================================
#  slack-gateway + tunnel ngrok — l'interactivité Slack (boutons ACK/Resolve)
# -----------------------------------------------------------------------------
#  slack-gateway est LE SEUL composant exposé à internet (via le tunnel) :
#  il vérifie la signature Slack et ne sait faire que 2 verbes du bridge.
#  Le bridge, GoAlert, Grafana restent inaccessibles de l'extérieur.
#  13/08/2026 : le .py vit dans l'image ghcr.io/yosrtaktak/sre-bridge (la
#  même que le bridge — seul le command change), plus dans une ConfigMap.
#
#  Secrets impératifs (jamais dans Git) :
#    kubectl -n monitoring create secret generic slack-gateway \
#      --from-literal=signing-secret='<Slack app -> Basic Information -> Signing Secret>'
#    kubectl -n monitoring create secret generic ngrok-tunnel \
#      --from-literal=authtoken='<dashboard.ngrok.com -> Your Authtoken>' \
#      --from-literal=domain='<ton-domaine>.ngrok-free.app'
#  Sans l'un des Secrets : le composant concerné refuse tout / ne démarre pas,
#  le reste de la plateforme n'est PAS affecté (boutons inertes, CLI intact).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-gateway
  namespace: monitoring
  labels:
    app: slack-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slack-gateway
  template:
    metadata:
      labels:
        app: slack-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/yosrtaktak/sre-bridge:sha-1af884e@sha256:53fe56f2518725b7ac73c2f5a942789df0152014fc0eabbb91914250b4c583ed
          command: ["python", "/app/src/slack-gateway.py"]
          env:
            - name: BRIDGE_URL
              value: "http://holmes-bridge.monitoring.svc.cluster.local:8000"
            - name: SLACK_SIGNING_SECRET_FILE
              value: "/etc/slack-gw/signing-secret"
          ports:
            - containerPort: 8010
          volumeMounts:
            - name: signing
              mountPath: /etc/slack-gw
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8010 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: signing
          secret:
            secretName: slack-gateway
            optional: true   # sans secret : gateway refuse tout (401), sans crash
---
apiVersion: v1
kind: Service
metadata:
  name: slack-gateway
  namespace: monitoring
  labels:
    app: slack-gateway
spec:
  selector:
    app: slack-gateway
  ports:
    - port: 8010
      targetPort: 8010
---
# Le tunnel : connexion SORTANTE permanente vers ngrok, qui publie
# https://<domain>/... -> slack-gateway:8010. Domaine statique du plan free.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok-tunnel
  namespace: monitoring
  labels:
    app: ngrok-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok-tunnel
  template:
    metadata:
      labels:
        app: ngrok-tunnel
    spec:
      containers:
        - name: ngrok
          image: ngrok/ngrok:latest@sha256:14d80d083e5b53145f416bbbd36238336c9de4016c43fd950eb2eb845670583b
          args:
            - "http"
            - "http://slack-gateway.monitoring.svc.cluster.local:8010"
            - "--domain=$(NGROK_DOMAIN)"
            - "--log=stdout"
          env:
            - name: NGROK_AUTHTOKEN
              valueFrom:
                secretKeyRef: { name: ngrok-tunnel, key: authtoken }
            - name: NGROK_DOMAIN
              valueFrom:
                secretKeyRef: { name: ngrok-tunnel, key: domain }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }

