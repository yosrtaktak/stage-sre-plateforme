# =============================================================================
#  stackrox-adapter — le traducteur StackRox -> Alertmanager (phase C).
# -----------------------------------------------------------------------------
#  Même image que le bridge et le slack-gateway : seul le `command` change
#  (motif éprouvé le 13/08). Conséquence voulue : ce composant traverse
#  build-images.yml (trivy image + SBOM + cosign) et doit passer l'admission
#  StackRox armée en B6 — l'agent de sécurité est soumis aux règles qu'il sert.
#
#  ⚠️ IMAGE : mettre le tag+digest produit par le build qui contient
#  src/stackrox_adapter.py (sortie du job build-sign : « image: …:tag@sha256:… »).
#  Le digest n'est pas cosmétique : c'est lui que l'admission vérifie.
#
#  Pas d'authentification sur /webhook : CHOIX ASSUMÉ. Le Service est
#  ClusterIP, aucune Ingress ne l'expose, et l'émetteur (Central) vit dans le
#  même cluster. Le durcissement suivant serait une NetworkPolicy limitant
#  l'accès au namespace stackrox — à faire en phase G avec les autres.
#  Destination : manifests/sre-agent/bridge/deploy/stackrox-adapter.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackrox-adapter
  namespace: monitoring
  labels:
    app: stackrox-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stackrox-adapter
  template:
    metadata:
      labels:
        app: stackrox-adapter
    spec:
      containers:
        - name: adapter
          image: ghcr.io/yosrtaktak/sre-bridge:sha-d6d1303@sha256:ed53c5188ac11263f52e8ba772b5e93315f02bc5366b973442792ded1a7bf5fa
          command: ["python", "/app/src/stackrox_adapter.py"]
          env:
            - name: ALERTMANAGER_URL
              value: "http://obs-alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts"
            # Base des liens cliquables vers la violation dans la console.
            # À adapter si la console est publiée via NodePort/Tailscale.
            - name: CENTRAL_URL
              value: "https://central.stackrox.svc.cluster.local:443"
            # Fenêtre pendant laquelle une violation ACTIVE reste "firing"
            # sans être réémise par StackRox (cf. en-tête du .py, décision 2).
            - name: HOLD_HOURS
              value: "24"
          ports:
            - containerPort: 8030
          readinessProbe:
            httpGet: { path: /healthz, port: 8030 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: stackrox-adapter
  namespace: monitoring
  labels:
    app: stackrox-adapter
spec:
  selector:
    app: stackrox-adapter
  ports:
    - port: 8030
      targetPort: 8030
