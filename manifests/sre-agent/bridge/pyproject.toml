# Outillage qualité du code de l'agent — consommé par le job lint+test de
# .github/workflows/agent-ci.yml.
# Destination : manifests/sre-agent/bridge/pyproject.toml
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]   # lignes longues assumées dans les .py historiques

[tool.pytest.ini_options]
testpaths = ["tests"]
