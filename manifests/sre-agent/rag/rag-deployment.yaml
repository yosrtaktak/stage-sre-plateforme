# =============================================================================
#  postmortem-rag : base vectorielle des incidents — VERSION GITOPS
# -----------------------------------------------------------------------------
#  Ce fichier vit dans manifests/sre-agent/rag/ et est déployé par
#  l'Application ArgoCD « ai-rag ». La ConfigMap postmortem-rag-script est
#  GÉNÉRÉE par kustomize (configMapGenerator, nom hashé) : ne plus la créer
#  à la main — tout changement du .py déclenche un rollout automatique.
#  Alimenté par le bridge (env RAG_URL) ; interrogé par HolmesGPT via le
#  toolset custom "incidents/search". Secrets (holmes-llm, qdrant-cloud) :
#  toujours créés à la main, jamais dans le repo (public).
#  05/08 : le cache passe d'emptyDir à un PVC — la validation humaine
#  (/validate) cherche dans le cache local, qui doit survivre aux rollouts
#  (désormais fréquents avec le hash de ConfigMap).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postmortem-rag
  namespace: monitoring
  labels:
    app: postmortem-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postmortem-rag
  template:
    metadata:
      labels:
        app: postmortem-rag
    spec:
      # PriorityClass définie dans bridge-deployment.yaml (correctif N2) :
      # le RAG survit à la pression du nœud (évincé le 28/07 pendant le
      # memory-hog — ContainerStatusUnknown).
      priorityClassName: sre-agent
      containers:
        - name: rag
          image: python:3.11-slim@sha256:9534e5a8e315485d4061ed659af0fd78a284c015f9b73661b41d6bab25604534
          command: ["python", "/app/postmortem-rag.py"]
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: holmes-llm
                  key: GEMINI_API_KEY
            # Vérifier la disponibilité du modèle d'embedding avec :
            #   curl -H "x-goog-api-key: $KEY" \
            #     https://generativelanguage.googleapis.com/v1beta/models | grep -i embed
            - name: EMBED_MODEL
              value: "gemini-embedding-001"
            # v2 — stockage Qdrant Cloud (free tier 1 Go, REST pur).
            # Secret à créer depuis cloud.qdrant.io (URL du cluster + clé) :
            #   kubectl -n monitoring create secret generic qdrant-cloud \
            #     --from-literal=url='https://xxx.cloud.qdrant.io:6333' \
            #     --from-literal=api-key='...'
            # Sans ce Secret (optional: true) : mode local v1, index en cache.
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: qdrant-cloud
                  key: url
                  optional: true
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-cloud
                  key: api-key
                  optional: true
            - name: COLLECTION
              value: "incidents"
            # Cache write-through + file d'attente resync (emptyDir) ;
            # INDEX_FILE reste lu au 1er démarrage pour migrer l'index v1.
            - name: CACHE_FILE
              value: "/data/cache.json"
            - name: INDEX_FILE
              value: "/data/index.json"
          ports:
            - containerPort: 8100
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: data          # index persisté (survit aux restarts du
              mountPath: /data    # conteneur ; PVC possible en v2)
          readinessProbe:
            httpGet: { path: /healthz, port: 8100 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: script
          configMap:
            name: postmortem-rag-script
        - name: data
          # 05/08 : PVC au lieu d'emptyDir — le cache (documents + flags de
          # validation humaine + file d'attente Qdrant) survit aux rollouts
          # automatiques déclenchés par chaque changement du script.
          persistentVolumeClaim:
            claimName: postmortem-rag-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postmortem-rag-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path     # provisioner par défaut de K3s
  resources:
    requests:
      storage: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postmortem-rag
  namespace: monitoring
  labels:
    app: postmortem-rag
spec:
  selector:
    app: postmortem-rag
  ports:
    - port: 8100
      targetPort: 8100

