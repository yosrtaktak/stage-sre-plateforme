apiVersion: v1
kind: ServiceAccount
metadata:
  name: productcatalogservice
  namespace: online-boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      serviceAccountName: productcatalogservice
      containers:
        - name: server
          image: yosrtaktak/productcatalogservice:v1@sha256:a114380b3801f9136cf3c3eaec5be55a77667dd76692b7b857cafd27c6b7b211
          ports:
            - containerPort: 3550
          env:
            - name: PORT
              value: "3550"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 3550
          livenessProbe:
            grpc:
              port: 3550
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: online-boutique
spec:
  selector:
    app: productcatalogservice
  ports:
    - port: 3550
      targetPort: 3550
      name: grpc
