apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendationservice
  namespace: online-boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      serviceAccountName: recommendationservice
      containers:
        - name: server
          image: yosrtaktak/recommendationservice:v1@sha256:9eedd8372c753836ca04ac65f3626ede4d8cf8f3c91e7b2577410a754750ffc5
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 8080
          livenessProbe:
            grpc:
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  namespace: online-boutique
spec:
  selector:
    app: recommendationservice
  ports:
    - port: 8080
      targetPort: 8080
      name: grpc
