apiVersion: v1
kind: ServiceAccount
metadata:
  name: cartservice
  namespace: online-boutique
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      serviceAccountName: cartservice
      containers:
        - name: server
          image: yosrtaktak/cartservice:v1@sha256:d60ecb1e083ddc62d8350f97050b20414619000dc55a5a645bdae09bba6fbe72
          ports:
            - containerPort: 7070
          env:
            - name: PORT
              value: "7070"
            - name: REDIS_ADDR
              value: "redis-cart:6379"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 7070
          livenessProbe:
            grpc:
              port: 7070
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: online-boutique
spec:
  selector:
    app: cartservice
  ports:
    - port: 7070
      targetPort: 7070
      name: grpc

