# redis-cart n'est pas un "app" Istio à part entière, mais on le scope
# explicitement (défense en profondeur) : seul cartservice y accède.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-redis-cart
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: redis-cart
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/cartservice"]
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/waypoint"]
