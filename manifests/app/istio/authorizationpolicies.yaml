# =============================================================================
#  Politiques d'autorisation L7 (waypoint) — modèle "default-deny" + allow-list
#  Fusion corrigée des anciens fichiers authpolicies.yaml + peerauthentication.yaml
#  (le bug d'origine : séparateur '---' manquant entre deny-all et allow-frontend).
# =============================================================================
# Default-deny : rien n'est autorisé dans le namespace sauf ce qui est listé
# explicitement plus bas.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: online-boutique
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # On tolère les deux conventions de nommage de la SA ingressgateway
              # selon le mode d'installation d'Istio.
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/loadgenerator"]
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/waypoint"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-productcatalogservice
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/online-boutique/sa/frontend
              - cluster.local/ns/online-boutique/sa/checkoutservice
              - cluster.local/ns/online-boutique/sa/recommendationservice
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/waypoint"]
