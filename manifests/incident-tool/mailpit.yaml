# =============================================================================
#  Mailpit — SMTP de laboratoire pour GoAlert (rien ne sort du cluster)
# -----------------------------------------------------------------------------
#  Capture TOUS les mails envoyés par GoAlert (codes de vérification,
#  notifications d'astreinte, escalades) et les affiche dans une web UI :
#    http://10.0.2.15:32025
#  Config GoAlert (Admin -> Config -> SMTP) :
#    Address     : mailpit.monitoring.svc.cluster.local:1025
#    Disable TLS : coché (Mailpit parle en clair)
#    Username / Password : vides
#    From Address: goalert@stage.local
#  Les adresses des users peuvent être fictives (yosr@stage.local...) :
#  Mailpit capture tout, quel que soit le destinataire.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: monitoring
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
          env:
            # Relais SMTP sortant (Gmail) : la config (hôte, app password…)
            # vit dans le Secret mailpit-relay, créé impérativement sur la VM
            # (repo public — jamais de credential dans Git). Créer le Secret
            # AVANT d'appliquer ce manifeste, sinon FailedMount.
            - name: MP_SMTP_RELAY_CONFIG
              value: /etc/mailpit/relay.yaml
            # Sans ce flag, le relais n'est que manuel (bouton Release de
            # l'UI) ; avec, tout mail entrant est relayé automatiquement
            # (sauf blocked_recipients du relay.yaml : @stage.local reste
            # capturé en local seulement).
            - name: MP_SMTP_RELAY_ALL
              value: "true"
          volumeMounts:
            - name: relay
              mountPath: /etc/mailpit
              readOnly: true
          ports:
            - containerPort: 1025   # SMTP
            - containerPort: 8025   # web UI
          readinessProbe:
            httpGet:
              path: /livez
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: relay
          secret:
            secretName: mailpit-relay
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: monitoring
  labels:
    app: mailpit
spec:
  type: NodePort
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
      nodePort: 32025

