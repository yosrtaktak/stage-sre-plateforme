        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[30m]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend"}[30m]))
          record: sli:frontend_availability:ratio30m
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[1h]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend"}[1h]))
          record: sli:frontend_availability:ratio1h
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[6h]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend"}[6h]))
          record: sli:frontend_availability:ratio6h
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[30d]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="frontend"}[30d]))
          record: sli:frontend_availability:ratio30d
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[5m]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice"}[5m]))
          record: sli:productcatalog_availability:ratio5m
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[30m]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice"}[30m]))
          record: sli:productcatalog_availability:ratio30m
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[1h]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice"}[1h]))
          record: sli:productcatalog_availability:ratio1h
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[6h]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="productcatalogservice"}[6h]))
          record: sli:productcatalog_availability:ratio6h
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[5m]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice"}[5m]))
          record: sli:cart_availability:ratio5m
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[30m]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice"}[30m]))
          record: sli:cart_availability:ratio30m
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[1h]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice"}[1h]))
          record: sli:cart_availability:ratio1h
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[6h]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="cartservice"}[6h]))
          record: sli:cart_availability:ratio6h
        - expr: |
            sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="redis-cart",response_code!~"5..",grpc_response_status!~"2|4|8|12|13|14|15"}[5m]))
            / sum(rate(istio_requests_total{reporter=~"source|waypoint",destination_workload="redis-cart"}[5m]))
          record: sli:redis_cart_availability:ratio5m
        - expr: |
            histogram_quantile(0.99,
              sum(rate(istio_request_duration_milliseconds_bucket{reporter=~"source|waypoint",destination_workload="checkoutservice"}[5m])) by (le)
            )
          record: sli:checkout_latency_p99ms:5m
        - expr: |
            sum(increase(kube_pod_container_status_restarts_total{namespace="online-boutique",pod=~"recommendationservice.*",container="server"}[15m]))
          record: chaos:recommendation_restarts:increase15m
        - expr: |
            histogram_quantile(0.99,
              sum(rate(istio_request_duration_milliseconds_bucket{reporter=~"source|waypoint",destination_workload="frontend"}[5m])) by (le)
            )
          record: sli:frontend_latency_p99ms:5m
        - expr: |
            sli:frontend_availability:ratio5m
            * sli:productcatalog_availability:ratio5m
            * sli:cart_availability:ratio5m
            * sli:checkout_success:ratio5m
          record: sli:user_journey_success:ratio5m
        - expr: |
            sli:frontend_availability:ratio30m
            * sli:productcatalog_availability:ratio30m
            * sli:cart_availability:ratio30m
            * sli:checkout_success:ratio30m
          record: sli:user_journey_success:ratio30m
        - expr: |
            sli:frontend_availability:ratio1h
            * sli:productcatalog_availability:ratio1h
            * sli:cart_availability:ratio1h
            * sli:checkout_success:ratio1h
          record: sli:user_journey_success:ratio1h
        - expr: |
            sli:frontend_availability:ratio6h
            * sli:productcatalog_availability:ratio6h
            * sli:cart_availability:ratio6h
            * sli:checkout_success:ratio6h
          record: sli:user_journey_success:ratio6h
      - name: user_facing_slo
        rules:
        - expr: (1 - sli:checkout_success:ratio5m) / 0.0005
          record: slo:checkout_success:burnrate5m
        - expr: (1 - sli:checkout_success:ratio30m) / 0.0005
          record: slo:checkout_success:burnrate30m
        - expr: (1 - sli:checkout_success:ratio1h) / 0.0005
          record: slo:checkout_success:burnrate1h
        - expr: (1 - sli:checkout_success:ratio6h) / 0.0005
          record: slo:checkout_success:burnrate6h
        - expr: (1 - sli:frontend_availability:ratio5m) / 0.001
          record: slo:frontend_availability:burnrate5m
        - expr: (1 - sli:frontend_availability:ratio30m) / 0.001
          record: slo:frontend_availability:burnrate30m
        - expr: (1 - sli:frontend_availability:ratio1h) / 0.001
          record: slo:frontend_availability:burnrate1h
        - expr: (1 - sli:frontend_availability:ratio6h) / 0.001
          record: slo:frontend_availability:burnrate6h
        - expr: 100 * (1 - ((1 - sli:checkout_success:ratio30d) / 0.0005))
          record: slo:checkout_success:error_budget_remaining_ratio
        - expr: 100 * (1 - ((1 - sli:frontend_availability:ratio30d) / 0.001))
          record: slo:frontend_availability:error_budget_remaining_ratio
        - expr: (1 - sli:productcatalog_availability:ratio5m) / 0.01
          record: slo:productcatalog_availability:burnrate5m
        - expr: (1 - sli:productcatalog_availability:ratio1h) / 0.01
          record: slo:productcatalog_availability:burnrate1h
        - expr: (1 - sli:productcatalog_availability:ratio30m) / 0.01
          record: slo:productcatalog_availability:burnrate30m
        - expr: (1 - sli:productcatalog_availability:ratio6h) / 0.01
          record: slo:productcatalog_availability:burnrate6h
        - expr: (1 - sli:cart_availability:ratio5m) / 0.01
          record: slo:cart_availability:burnrate5m
        - expr: (1 - sli:cart_availability:ratio1h) / 0.01
          record: slo:cart_availability:burnrate1h
        - expr: (1 - sli:cart_availability:ratio30m) / 0.01
          record: slo:cart_availability:burnrate30m
        - expr: (1 - sli:cart_availability:ratio6h) / 0.01
          record: slo:cart_availability:burnrate6h
        - expr: (1 - sli:user_journey_success:ratio5m) / 0.005
          record: slo:user_journey_success:burnrate5m
        - expr: (1 - sli:user_journey_success:ratio30m) / 0.005
          record: slo:user_journey_success:burnrate30m
        - expr: (1 - sli:user_journey_success:ratio1h) / 0.005
          record: slo:user_journey_success:burnrate1h
        - expr: (1 - sli:user_journey_success:ratio6h) / 0.005
          record: slo:user_journey_success:burnrate6h
tempo:
  fullnameOverride: tempo
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
  serviceMonitor:
    enabled: false
  tempo:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      zipkin:
        endpoint: 0.0.0.0:9411
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 256Mi
    retention: 24h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
