# redis-cart isn't an Istio "app" with its own SA logic beyond cartservice,
# but we still scope it explicitly for defense in depth.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-redis-cart
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: redis-cart
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/cartservice"]
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/waypoint"]
