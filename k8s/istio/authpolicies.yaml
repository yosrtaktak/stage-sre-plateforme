apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: frontend
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/loadgenerator"]
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/waypoint"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-productcatalogservice
  namespace: online-boutique
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/online-boutique/sa/frontend
              - cluster.local/ns/online-boutique/sa/checkoutservice
              - cluster.local/ns/online-boutique/sa/recommendationservice
    - from:
        - source:
            principals: ["cluster.local/ns/online-boutique/sa/waypoint"]
---
