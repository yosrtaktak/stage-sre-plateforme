# =============================================================================
#  security-scan — l'étage CI du pipeline DevSecOps (rapport du 11/08).
#  ⚠️ MODE OBSERVATION AU DÉPART : les gates ont exit-code "0" (ils rapportent
#  sans bloquer). Après 48 h de triage du bruit historique (.trivyignore
#  justifié), passer les deux lignes marquées « GATE » à "1" et exiger les
#  checks dans la protection de branche.
#  Destination : .github/workflows/security-scan.yml
# =============================================================================
name: security-scan
on:
  pull_request:
    branches: [stage-yosr]
  push:
    branches: [stage-yosr]
  # Sur push/PR, gitleaks-action ne scanne QUE les nouveaux commits (gate
  # incrémental rapide). Le scan de TOUT l'historique passe par ces deux
  # déclencheurs : manuel (bouton « Run workflow ») et hebdomadaire.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"    # lundi 06:00 UTC — audit complet hebdomadaire

# Moindre privilège : le token du workflow ne sait QUE lire le repo.
permissions:
  contents: read
  pull-requests: read   # gitleaks-action (event PR) : lister les commits de la PR

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:                     # ── chasse aux secrets sur TOUT l'historique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09      # v5      # à épingler par SHA (Renovate)
        with:
          fetch-depth: 0               # historique complet — la leçon du PAT ArgoCD
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifests-config:            # ── misconfigs K8s (runAsRoot, :latest, NodePort…)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: manifests/
          trivyignores: .trivyignore.yaml
          severity: CRITICAL
          exit-code: "1"

  deps-cve:                    # ── CVE corrigeables dans les dépendances du repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: src
          exit-code: "1"

  sbom:                        # ── inventaire SPDX versionné à chaque commit
    # trivy sbom plutôt que syft : même binaire que les gates, un outil de
    # moins à maintenir (arbitrage §8.1 du rapport DevSecOps).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: sbom-${{ github.sha }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json

  lint-workflows:              # ── zizmor : la CI qui se scanne elle-même
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # zizmor sort en erreur dès qu'il trouve quelque chose — le « »
      # le met en observation. GATE : le retirer en même temps que les autres.
      - run: pipx run zizmor .github/workflows/
  radar-high:                  # ── MESURE, jamais un gate : la descente du backlog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: manifests/
          severity: HIGH
          exit-code: "0"        # JAMAIS "1" — un mur sur les HIGH bloquerait tout
          format: json
          output: radar-high.json

      - name: Radar HIGH — compter et publier
        run: |
          set -euo pipefail
          S="$GITHUB_STEP_SUMMARY"
          TOTAL=$(jq '[.Results[]?|(.Misconfigurations//[])|length]|add//0' radar-high.json)
          EXC=0
          for f in .trivyignore .trivyignore.yaml; do
            [ -f "$f" ] && EXC=$((EXC + $(grep -cE '^ *(AVD-|CVE-|- id:)' "$f" || true)))
          done
          echo "## 🎯 Radar HIGH — backlog de durcissement" >> "$S"
          echo "" >> "$S"
          echo "**$TOTAL** findings HIGH · **$EXC** exception(s) déclarée(s)" >> "$S"
          echo "" >> "$S"
          echo '### Par règle' >> "$S"
          echo '```' >> "$S"
          jq -r '[.Results[]?|(.Misconfigurations//[])[]|.ID]|group_by(.)|map("\(length) \(.[0])")[]' radar-high.json | sort -rn | head -15 >> "$S"
          echo '```' >> "$S"
          echo "RADAR_HIGH=$TOTAL EXCEPTIONS=$EXC" | tee radar-high.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-high-${{ github.sha }}
          path: |
            radar-high.json
            radar-high.txt
          retention-days: 90

      - name: Radar HIGH — ventilation par répertoire
        run: |
            set -euo pipefail
            S="$GITHUB_STEP_SUMMARY"
            jq -r '.Results[]?|select(((.Misconfigurations//[])|length)>0)|"\(.Misconfigurations|length) \(.Target)"' radar-high.json > radar-files.txt
            ADDR=$(awk '{t=$2;sub(/^manifests\//,"",t);if(t~/^app\//)s+=$1} END{print s+0}' radar-files.txt)
            MINE=$(awk '{t=$2;sub(/^manifests\//,"",t);if(t~/^sre-agent\//)s+=$1} END{print s+0}' radar-files.txt)
            echo '### Par répertoire' >> "$S"
            echo '```' >> "$S"
            awk '{t=$2;sub(/^manifests\//,"",t);split(t,p,"/");s[p[1]]+=$1} END{for(k in s) print s[k], k}' radar-files.txt | sort -rn >> "$S"
            echo '```' >> "$S"
            echo "**Adressable par l'agent (app/) : $ADDR** · refusé par construction (sre-agent/) : $MINE" >> "$S"
            echo "RADAR_ADDRESSABLE=$ADDR RADAR_SRE_AGENT=$MINE" | tee -a radar-high.txt
