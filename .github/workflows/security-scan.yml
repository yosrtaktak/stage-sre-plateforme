# =============================================================================
#  security-scan — l'étage CI du pipeline DevSecOps (rapport du 11/08).
#  ⚠️ MODE OBSERVATION AU DÉPART : les gates ont exit-code "0" (ils rapportent
#  sans bloquer). Après 48 h de triage du bruit historique (.trivyignore
#  justifié), passer les deux lignes marquées « GATE » à "1" et exiger les
#  checks dans la protection de branche.
#  Destination : .github/workflows/security-scan.yml
# =============================================================================
name: security-scan
on:
  pull_request:
    branches: [stage-yosr]
  push:
    branches: [stage-yosr]
  # Sur push/PR, gitleaks-action ne scanne QUE les nouveaux commits (gate
  # incrémental rapide). Le scan de TOUT l'historique passe par ces deux
  # déclencheurs : manuel (bouton « Run workflow ») et hebdomadaire.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"    # lundi 06:00 UTC — audit complet hebdomadaire

# Moindre privilège : le token du workflow ne sait QUE lire le repo.
permissions:
  contents: read
  pull-requests: read   # gitleaks-action (event PR) : lister les commits de la PR

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:                     # ── chasse aux secrets sur TOUT l'historique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5      # à épingler par SHA (Renovate)
        with:
          fetch-depth: 0               # historique complet — la leçon du PAT ArgoCD
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifests-config:            # ── misconfigs K8s (runAsRoot, :latest, NodePort…)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: manifests/
          trivyignores: .trivyignore.yaml
          severity: CRITICAL
          exit-code: "1"

  deps-cve:                    # ── CVE corrigeables dans les dépendances du repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: src
          exit-code: "1"

  sbom:                        # ── inventaire SPDX versionné à chaque commit
    # trivy sbom plutôt que syft : même binaire que les gates, un outil de
    # moins à maintenir (arbitrage §8.1 du rapport DevSecOps).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: sbom-${{ github.sha }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json

  lint-workflows:              # ── zizmor : la CI qui se scanne elle-même
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # zizmor sort en erreur dès qu'il trouve quelque chose — le « »
      # le met en observation. GATE : le retirer en même temps que les autres.
      - run: pipx run zizmor .github/workflows/
