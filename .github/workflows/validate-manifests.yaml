# CI de validation — required status check de la branche stage-yosr.
# Tourne sur TOUTES les PRs (pas de filtre paths : un required check qui ne
# se déclenche pas resterait « Expected » et bloquerait le merge à vie).
name: validate-manifests
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: kustomize build
        run: |
          kubectl kustomize manifests/app > /tmp/app.yaml
          kubectl kustomize manifests/dashboards > /dev/null
      - name: kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary /tmp/app.yaml
