# =============================================================================
#  .gitleaks.toml — configuration du chasseur de secrets.
#  Destination : RACINE du repo (.gitleaks.toml)
#
#  Règle du jeu (la même que .trivyignore) : on n'allowliste JAMAIS en
#  silence — chaque entrée est datée, justifiée, et pointe un secret RÉVOQUÉ.
#
#  ⚠️ NE PAS décommenter le bloc allowlist avant d'avoir capturé le finding
#  du premier run (c'est la pièce du post-mortem sécurité) ET vérifié que le
#  token est bien révoqué côté GitHub.
# =============================================================================
[extend]
# Hérite des règles par défaut de gitleaks (formats GitHub, AWS, Slack, etc.)
useDefault = true

# --- À décommenter APRÈS le premier run et la révocation (étape 6 du guide) ---
